plugins {
    id 'com.android.application'
}

android {
    namespace 'app.gramafon.webview'
    compileSdk 34

    defaultConfig {
        applicationId 'app.gramafon.webview'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // آدرس سایت از ورک‌فلو میاد: gradle assembleDebug -PsiteUrl=https://...
        def siteUrl = (project.findProperty('siteUrl') ?: 'https://YOUR-SITE-ADDRESS/').toString()
        buildConfigField 'String', 'SITE_URL', "\"${siteUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
