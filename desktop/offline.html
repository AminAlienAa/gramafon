<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گرامافون</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #120a1a; color: #f4ebe1; font: 16px/1.9 Tahoma, "Segoe UI", sans-serif; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 1.6rem; font-weight: 700; }
  p { margin: 0 0 22px; color: #b9a9c9; }
  button { padding: 12px 28px; border: 0; border-radius: 14px; background: #ffb454; color: #1b1026; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <h1>اینترنت وصل نیست</h1>
    <p>وصل که شد، خودش دوباره باز می‌شه. اگه فیلترشکن لازمه، روشنش کن.</p>
    <button id="retry" type="button">تلاش دوباره</button>
  </main>
<script>
  const target = new URLSearchParams(location.search).get('u');
  const go = () => { if (target) location.href = target; };
  document.getElementById('retry').addEventListener('click', go);
  setInterval(() => {
    if (!target) return;
    fetch(target, { mode: 'no-cors', cache: 'no-store' }).then(go).catch(() => {});
  }, 5000);
</script>
</body>
</html>
