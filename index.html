<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<script>(function(){var d=document.documentElement;try{var p=localStorage.getItem('gramafon:scheme');p=p?JSON.parse(p):'dark';var l=p==='light'||(p==='auto'&&matchMedia('(prefers-color-scheme: light)').matches);d.dataset.scheme=l?'light':'dark';}catch(e){d.dataset.scheme='dark';}try{d.dataset.motion=matchMedia('(prefers-reduced-motion: reduce)').matches?'reduced':'full';}catch(e){d.dataset.motion='full';}})();</script>
<title>گرامافون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="گرامافون">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* ───────── themes: blue (idle) · green (Spotify) · orange (SoundCloud) ───────── */
  :root {
    --bg: #071018;
    --surface: #0d1c2b;
    --surface-2: #163350;
    --surface-focus: #102840;
    --line: #21456e;
    --line-hover: #2f6ba0;
    --accent: #2f9bff;
    --on-accent: #04101c;
    --text: #eef2f8;
    --muted: #a8c0d9;
    --dim: #7ea3c2;
    --groove-a: #10202f;
    --groove-b: #04080c;
    --ring: #020406;
    --danger: #ff8a8a;
    --accent-ink: var(--accent);       /* accent used for text/links */
    --hover: rgba(255,255,255,.06);
    --shadow: rgba(0,0,0,.7);
    --glow: 30%;
    --notice-bg: #3a1d2b;
    --notice-line: #7a3550;
  }
  html[data-theme="spotify"] {
    --bg: #07130c;
    --surface: #0d2016;
    --surface-2: #163625;
    --surface-focus: #102a1c;
    --line: #21503a;
    --line-hover: #2f7050;
    --accent: #1ed760;
    --on-accent: #06180d;
    --muted: #a8c7b5;
    --dim: #76a189;
    --groove-a: #10251a;
    --groove-b: #040b07;
    --ring: #020604;
  }
  html[data-theme="soundcloud"] {
    --bg: #170a04;
    --surface: #26120a;
    --surface-2: #3b1d0e;
    --surface-focus: #2e170c;
    --line: #5e2d15;
    --line-hover: #8c4523;
    --accent: #ff5500;
    --on-accent: #190800;
    --muted: #d6b9a6;
    --dim: #a5836f;
    --groove-a: #261309;
    --groove-b: #0c0502;
    --ring: #060200;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { color-scheme: dark; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Vazirmatn', Tahoma, 'Segoe UI', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    transition: background-color .7s ease;
  }

  button, input { font: inherit; color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 24px 64px;
  }

  /* ───────── decorative background glow: three soft blurred blobs, tinted with the
     current theme's own colors, drifting very slowly. Cheap: transform + opacity only. ───────── */
  .bg-deco {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-deco span {
    position: absolute;
    width: 48vmax;
    height: 48vmax;
    border-radius: 50%;
    filter: blur(70px);
    will-change: transform;
  }
  .bg-deco .b1 {
    top: -20vmax;
    left: -16vmax;
    opacity: .32;
    background: radial-gradient(circle at 30% 30%, var(--accent), transparent 70%);
    animation: drift1 20s ease-in-out infinite;
  }
  .bg-deco .b2 {
    bottom: -22vmax;
    right: -18vmax;
    opacity: .22;
    background: radial-gradient(circle at 60% 40%, var(--line-hover), transparent 70%);
    animation: drift2 23s ease-in-out infinite;
  }
  .bg-deco .b3 {
    top: 28%;
    right: -22vmax;
    opacity: .16;
    background: radial-gradient(circle at 50% 50%, var(--accent-ink), transparent 70%);
    animation: drift3 22s ease-in-out infinite;
  }
  @keyframes drift1 {
    0%   { transform: translate(0, 0) scale(1); opacity: .32; }
    25%  { transform: translate(4vmax, 3vmax) scale(1.07); opacity: .4; }
    50%  { transform: translate(9vmax, 7vmax) scale(1.16); opacity: .48; }
    75%  { transform: translate(4vmax, 3vmax) scale(1.07); opacity: .4; }
    100% { transform: translate(0, 0) scale(1); opacity: .32; }
  }
  @keyframes drift2 {
    0%   { transform: translate(0, 0) scale(1); opacity: .22; }
    25%  { transform: translate(-3.5vmax, -4.5vmax) scale(1.08); opacity: .32; }
    50%  { transform: translate(-7vmax, -9vmax) scale(1.2); opacity: .4; }
    75%  { transform: translate(-3.5vmax, -4.5vmax) scale(1.08); opacity: .32; }
    100% { transform: translate(0, 0) scale(1); opacity: .22; }
  }
  @keyframes drift3 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-2vmax, 5vmax) scale(.95); } }

  /* an occasional faint streak of light drifting across, like a passing reflection */
  .bg-deco .spark {
    top: 14%;
    left: -12vmax;
    width: 26vmax;
    height: 2px;
    border-radius: 2px;
    filter: blur(1px);
    opacity: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    animation: spark 11s cubic-bezier(.37, 0, .63, 1) infinite;
    animation-delay: 3s;
  }
  @keyframes spark {
    0%, 78%, 100% { opacity: 0; transform: translate(0, 0) rotate(16deg); }
    84% { opacity: .55; }
    92% { opacity: 0; transform: translate(70vmax, 26vmax) rotate(16deg); }
  }

  /* low-end devices: one smaller, less blurred blob instead of three, and no shine/spark */
  html[data-perf="low"] .bg-deco .b2,
  html[data-perf="low"] .bg-deco .b3,
  html[data-perf="low"] .bg-deco .spark { display: none; }
  html[data-perf="low"] .bg-deco .b1 { filter: blur(40px); width: 60vmax; height: 60vmax; }

  /* a few tiny drifting motes of light, purely decorative */
  .bg-deco .mote {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
  }
  .bg-deco .m1 { top: 22%; left: 12%; animation: mote1 14s ease-in-out infinite; }
  .bg-deco .m2 { top: 68%; left: 82%; animation: mote2 17s ease-in-out infinite 2s; }
  .bg-deco .m3 { top: 40%; left: 68%; animation: mote3 12s ease-in-out infinite 5s; }
  .bg-deco .m4 { top: 80%; left: 28%; animation: mote1 19s ease-in-out infinite 8s; }
  @keyframes mote1 { 0%, 100% { opacity: 0; transform: translateY(0); } 15% { opacity: .5; } 50% { opacity: .18; transform: translateY(-3.5vmax); } 85% { opacity: .5; } }
  @keyframes mote2 { 0%, 100% { opacity: 0; transform: translate(0, 0); } 20% { opacity: .4; } 50% { opacity: .15; transform: translate(-2vmax, -4vmax); } 80% { opacity: .4; } }
  @keyframes mote3 { 0%, 100% { opacity: 0; transform: translateY(0); } 25% { opacity: .45; } 50% { opacity: .12; transform: translateY(4vmax); } 75% { opacity: .45; } }
  html[data-perf="low"] .bg-deco .mote { display: none; }

  /* ───────── header ───────── */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Lalezar', 'Vazirmatn', Tahoma, sans-serif;
    font-size: 1.5rem;
  }
  .brand svg { width: 28px; height: 28px; }
  .brand .b-disc { fill: var(--groove-b); stroke: var(--line); }
  .brand .b-ring { fill: none; stroke: var(--surface-2); }
  .brand .b-label { fill: var(--accent); }
  .brand .b-hole { fill: var(--bg); }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  .social {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin: 56px 0 0;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }
  .social a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font-size: .875rem;
    text-decoration: none;
    transition: color .15s, border-color .15s;
  }
  .social a:hover { color: var(--accent-ink); border-color: var(--accent); }
  .social svg { width: 16px; height: 16px; flex: none; }

  /* ───────── hero + form ───────── */
  .hero { max-width: 720px; margin-top: 40px; }

  h1 {
    margin: 0;
    font-family: 'Lalezar', 'Vazirmatn', Tahoma, sans-serif;
    font-weight: 400;
    font-size: clamp(2.5rem, 7vw, 4.4rem);
    line-height: 1.2;
    letter-spacing: 0;
  }

  .lead { margin: 12px 0 28px; max-width: 56ch; color: var(--muted); }

  .field { display: flex; gap: 10px; }

  .field input {
    flex: 1;
    min-width: 0;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    transition: border-color .15s, background-color .4s;
  }
  .field input::placeholder { color: var(--dim); }
  .field input:hover { border-color: var(--line-hover); }
  .field input:focus { outline: none; border-color: var(--accent); background: var(--surface-focus); }

  .field button {
    padding: 0 28px;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
    cursor: pointer;
    transition: transform .2s cubic-bezier(.16, 1, .3, 1), filter .2s ease, background-color .4s ease;
  }
  .field button:hover { filter: brightness(1.08); }
  .field button:active { transform: translateY(1px); }

  .hint { margin: 10px 4px 0; font-size: .875rem; color: var(--muted); min-height: 1.6em; }
  .hint.error { color: var(--danger); }

  /* ───────── layout ───────── */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 40px;
    margin-top: 40px;
    align-items: start;
  }

  /* ───────── stage: record rising out of the sleeve ───────── */
  .stage {
    --size: min(300px, 62vw);
    position: relative;
    padding-top: 8px;
  }

  .stage::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    width: calc(var(--size) * 1.7);
    height: calc(var(--size) * 1.1);
    transform: translateX(-50%);
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) var(--glow), transparent), transparent);
    opacity: 0;
    transition: opacity 1s .3s;
    pointer-events: none;
  }
  .stage.out::before { opacity: 1; }

  .record-clip {
    position: relative;
    z-index: 0;
    width: var(--size);
    height: calc(var(--size) * .5);
    margin: 0 auto;
    overflow: hidden;
  }

  .record-clip { transition: height .9s cubic-bezier(.16, 1, .3, 1); }
  .stage.idle .record-clip { height: 0; }

  .record-slide {
    position: relative;
    width: var(--size);
    height: var(--size);
    transform: translateY(102%);
    transition: transform .9s cubic-bezier(.16, 1, .3, 1);
  }
  .stage.out .record-slide { transform: none; }

  .record {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      conic-gradient(from 0deg, transparent 0 6%, rgba(255,255,255,.07) 9%, transparent 14% 52%, rgba(255,255,255,.05) 55%, transparent 60%),
      repeating-radial-gradient(circle at center, var(--groove-a) 0 1.5px, var(--groove-b) 1.5px 3.5px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.22),
      0 0 0 3px #050208,
      inset 0 0 0 7px rgba(0,0,0,.28),
      0 26px 55px -16px rgba(0,0,0,.65);
    animation: spin 9s linear infinite;
    animation-play-state: paused;
  }
  .stage.spin .record { animation-play-state: running; }

  .record::before {
    content: '';
    position: absolute;
    inset: 4%;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 24%, rgba(255,255,255,.14), transparent 45%);
    pointer-events: none;
  }

  .record .label {
    position: absolute;
    inset: 33%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 34% 28%, rgba(255,255,255,.35), transparent 55%),
      conic-gradient(rgba(0,0,0,0) 0 50%, rgba(0,0,0,.24) 50% 100%),
      var(--accent);
    box-shadow: 0 0 0 3px var(--ring), inset 0 2px 5px rgba(0,0,0,.3);
  }
  .record .mark {
    position: absolute;
    top: 12%;
    left: 50%;
    width: 8%;
    aspect-ratio: 1;
    transform: translateX(-50%);
    border-radius: 50%;
    background: rgba(255,255,255,.8);
  }
  .record .hole {
    position: absolute;
    inset: 47.5%;
    border-radius: 50%;
    background: var(--bg);
    box-shadow: 0 0 0 2px rgba(255,255,255,.14);
  }

  /* static reflection so the light doesn't spin with the record */
  .record-slide::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    background: conic-gradient(from 25deg, transparent 0 8%, rgba(255,255,255,.11) 12%, transparent 18% 58%, rgba(255,255,255,.08) 62%, transparent 68%);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .sleeve {
    position: relative;
    z-index: 1;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 30px 60px -30px var(--shadow);
    transition: background-color .7s, border-color .7s;
  }

  .player { position: relative; border-radius: 14px; overflow: hidden; }
  .player iframe { display: block; width: 100%; border: 0; }

  .empty {
    display: grid;
    place-items: center;
    gap: 6px;
    padding: 52px 24px;
    text-align: center;
  }
  .empty strong {
    font-family: 'Lalezar', 'Vazirmatn', Tahoma, sans-serif;
    font-weight: 400;
    font-size: 1.6rem;
  }
  .empty span { max-width: 36ch; color: var(--muted); }

  .caption { margin: 14px 6px 0; font-size: .875rem; color: var(--muted); min-height: 1.4em; }
  .caption a { color: var(--accent-ink); text-underline-offset: 3px; }
  .caption .warn { color: var(--danger); }

  .notice {
    margin: 0 0 24px;
    padding: 12px 16px;
    background: var(--notice-bg);
    border: 1px solid var(--notice-line);
    border-radius: 14px;
    color: var(--text);
    font-size: .9375rem;
  }

  /* ───────── custom SoundCloud player ───────── */
  .cp { padding: 6px 6px 2px; }

  .np { display: flex; align-items: center; gap: 16px; }
  .art {
    flex: none;
    width: 84px;
    height: 84px;
    border-radius: 14px;
    overflow: hidden;
    background: var(--surface-2);
  }
  .art img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .np-text { min-width: 0; display: grid; gap: 0; }
  .np-title {
    font-weight: 700;
    font-size: 1.0625rem;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .np-artist { color: var(--muted); font-size: .9375rem; line-height: 1.6; }
  .np-link { justify-self: start; font-size: .8125rem; color: var(--accent-ink); text-underline-offset: 3px; }

  .seek {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    direction: ltr;
  }
  .time { font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .time:last-child { text-align: right; }

  .range {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 6px;
    margin: 0;
    border-radius: 6px;
    background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line) var(--p, 0%));
    cursor: pointer;
  }
  .range:disabled { cursor: default; opacity: .5; }
  .range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border: 0;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 0 4px var(--surface);
  }
  .range::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: 0;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 0 4px var(--surface);
  }
  .range::-moz-range-track { background: transparent; }

  .controls {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-top: 14px;
    direction: ltr;
  }
  .pad { display: flex; align-items: center; gap: 14px; }

  .cbtn {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    background: none;
    border: 0;
    border-radius: 50%;
    color: var(--text);
    cursor: pointer;
    transition: background-color .15s, opacity .15s;
  }
  .cbtn:hover:not(:disabled) { background: var(--hover); }
  .cbtn:disabled { opacity: .35; cursor: default; }
  .cbtn svg { width: 22px; height: 22px; }

  .cbtn.play {
    width: 60px;
    height: 60px;
    background: var(--accent);
    color: var(--on-accent);
  }
  .cbtn.play:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
  .cbtn.play svg { width: 26px; height: 26px; }

  .vol { justify-self: end; display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .vol svg { width: 18px; height: 18px; flex: none; }
  .vol .range { width: 88px; }

  .tracks {
    list-style: none;
    margin: 18px 0 0;
    padding: 0;
    max-height: 264px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .track-btn {
    width: 100%;
    display: grid;
    grid-template-columns: 26px minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    background: none;
    border: 0;
    border-radius: 10px;
    text-align: start;
    cursor: pointer;
  }
  .track-btn:hover { background: var(--hover); }
  .track.current .track-btn { background: var(--surface-2); }
  .track-num { display: grid; place-items: center; font-size: .8125rem; color: var(--dim); }
  .track-text { min-width: 0; display: grid; }
  .track-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.6; }
  .track.current .track-title { color: var(--accent-ink); font-weight: 500; }
  .track-artist { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .8125rem; color: var(--muted); line-height: 1.5; }
  .track-time { font-size: .8125rem; color: var(--muted); direction: ltr; font-variant-numeric: tabular-nums; }

  .eq { display: none; align-items: flex-end; gap: 2px; height: 14px; }
  .eq i { display: block; width: 3px; height: 35%; background: var(--accent); border-radius: 1px; transform-origin: bottom; will-change: transform; animation: eq .9s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: -.3s; }
  .eq i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eq { to { transform: scaleY(2.6); } }
  .tracks.playing .current .eq { display: flex; }
  .tracks.playing .current .track-num b { display: none; }
  .track-num b { font-weight: 400; }

  /* Spotify: read-only status header above the official embed */
  .bar { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; direction: ltr; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s linear; }
  .sp-hint { margin: 14px 2px 0; font-size: .8125rem; color: var(--muted); }
  .sp-embed { margin-top: 14px; border-radius: 12px; overflow: hidden; }
  .sp-embed iframe { display: block; width: 100%; border: 0; }

  /* the official SoundCloud iframe stays invisible: it only produces the sound */
  .official iframe { display: block; width: 100%; border: 0; }
  .official.off {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 166px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }

  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin: 12px 6px 2px; font-size: .8125rem; }
  .foot .note { flex-basis: 100%; color: var(--danger); }
  .linkbtn {
    padding: 4px 0;
    background: none;
    border: 0;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .linkbtn:hover { color: var(--accent-ink); }

  /* ───────── library ───────── */
  .library {
    padding-inline-start: 28px;
    border-inline-start: 1px solid var(--line);
  }
  .library h2 {
    margin: 0 0 12px;
    font-family: 'Lalezar', 'Vazirmatn', Tahoma, sans-serif;
    font-weight: 400;
    font-size: 1.6rem;
  }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }

  .item { position: relative; display: flex; align-items: center; border-radius: 12px; }
  .item.active { background: var(--surface-2); }
  .item.active::before {
    content: '';
    position: absolute;
    inset-inline-start: 0;
    top: 12px;
    bottom: 12px;
    width: 3px;
    border-radius: 3px;
    background: var(--accent);
  }

  .item-main {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: none;
    border: 0;
    border-radius: 12px;
    text-align: start;
    cursor: pointer;
  }
  .item:not(.active) .item-main:hover { background: var(--hover); }

  .src-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  .item-text { min-width: 0; display: grid; }
  .item-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .item-meta { font-size: .8125rem; color: var(--muted); line-height: 1.5; }

  .icon-btn {
    flex: none;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    background: none;
    border: 0;
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, background-color .15s;
  }
  .icon-btn:hover { color: var(--text); background: var(--hover); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn svg { width: 16px; height: 16px; }
  .item-actions { display: flex; padding-inline-end: 6px; }

  .lib-empty { margin: 0; color: var(--muted); font-size: .9375rem; }
  .lib-note { margin: 18px 0 0; font-size: .8125rem; color: var(--dim); }

  /* ───────── responsive ───────── */
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 48px; }
    .library { padding-inline-start: 0; border-inline-start: 0; padding-top: 28px; border-top: 1px solid var(--line); }
  }
  @media (max-width: 520px) {
    .page { padding: 18px 16px 48px; }
    .field { flex-wrap: wrap; }
    .field button { width: 100%; padding: 13px; }
    .sleeve { padding: 10px; border-radius: 18px; }
    .art { width: 68px; height: 68px; }
    .vol .range { width: 64px; }
  }

  html[data-motion="reduced"] .record, html[data-motion="reduced"] .eq i { animation: none; }
  html[data-motion="reduced"] .record-slide, html[data-motion="reduced"] .record-clip,
  html[data-motion="reduced"] .stage::before, html[data-motion="reduced"] body { transition: none; }

  /* ───────── phone / Telegram in-app browser ───────── */
  html { -webkit-text-size-adjust: 100%; }
  html, body { overflow-x: clip; }
  .stage::before { max-width: 100%; }
  body { min-height: 100vh; min-height: 100dvh; }
  button, .linkbtn, .track-btn, .item-main { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  .page {
    padding-top: max(24px, env(safe-area-inset-top));
    padding-right: max(24px, env(safe-area-inset-right));
    padding-left: max(24px, env(safe-area-inset-left));
    padding-bottom: max(64px, calc(env(safe-area-inset-bottom) + 32px));
  }

  /* bigger touch target around the thin slider line */
  .range {
    height: 26px;
    padding: 10px 0;
    border-radius: 13px;
    background-clip: content-box;
    background-origin: content-box;
  }

  .track.pending .track-title { color: var(--dim); }
  .track-title, .track-artist, .np-title, .np-artist, .item-title { text-align: right; unicode-bidi: plaintext; }
  html.ios .vol { display: none; }          /* iOS ignores programmatic volume */
  .note.info { color: var(--muted); }

  @media (pointer: coarse) {
    .icon-btn { width: 40px; height: 40px; }
    .cbtn { width: 48px; height: 48px; }
    .cbtn.play { width: 64px; height: 64px; }
    .item-main { padding: 12px 14px; }
    .range::-webkit-slider-thumb { width: 22px; height: 22px; }
    .range::-moz-range-thumb { width: 22px; height: 22px; }
    .social a { padding: 8px 14px; }
    .linkbtn { padding: 10px 0; }
  }

  @media (max-width: 520px) {
    .page {
      padding-top: max(14px, env(safe-area-inset-top));
      padding-right: max(16px, env(safe-area-inset-right));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-bottom: max(40px, calc(env(safe-area-inset-bottom) + 24px));
    }
    .brand { font-size: 1.3rem; }
    .hero { margin-top: 24px; }
    h1 { font-size: clamp(2rem, 9.5vw, 2.6rem); }
    .lead { margin: 8px 0 18px; font-size: .9375rem; }
    .field input { padding: 14px 16px; }
    .layout { margin-top: 28px; gap: 36px; }
    .stage { --size: min(180px, 48vw); }
    .np { gap: 12px; }
    .np-title { font-size: 1rem; }
    .seek { grid-template-columns: 38px 1fr 38px; gap: 8px; margin-top: 14px; }
    .controls { grid-template-columns: 1fr; justify-items: center; row-gap: 8px; margin-top: 8px; }
    .controls > span { display: none; }
    .vol { justify-self: stretch; }
    .vol .range { flex: 1; width: auto; }
    .tracks { max-height: 300px; }
    .track-btn { padding: 10px 8px; gap: 10px; }
    .library h2 { font-size: 1.4rem; }
  }

  /* ───────── device / mode adaptations (set by JS on <html>) ───────── */
  html[data-device="mobile"] .icon-btn { width: 40px; height: 40px; }
  html[data-device="mobile"] .cbtn { width: 48px; height: 48px; }
  html[data-device="mobile"] .cbtn.play { width: 64px; height: 64px; }
  html[data-device="mobile"] .item-main { padding: 12px 14px; }
  html[data-device="mobile"] .range::-webkit-slider-thumb { width: 22px; height: 22px; }
  html[data-device="mobile"] .range::-moz-range-thumb { width: 22px; height: 22px; }
  html[data-device="mobile"] .social a, html[data-device="mobile"] .install { padding: 8px 14px; }
  html[data-device="mobile"] .linkbtn { padding: 10px 0; }
  html[data-device="mobile"] .kbd-hint { display: none; }
  html[data-device="desktop"] .tip { display: none; }

  .install {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 14px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: transparent;
    color: var(--accent-ink);
    font-size: .875rem;
    cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  .install:hover { background: var(--accent); color: var(--on-accent); }
  .install svg { width: 16px; height: 16px; flex: none; }

  .tip {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin: 14px 0 0;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--muted);
    font-size: .875rem;
    line-height: 1.7;
  }
  .tip b { color: var(--text); font-weight: 500; direction: ltr; unicode-bidi: isolate; }
  .tip button { flex: none; width: 32px; height: 32px; padding: 0; background: none; border: 0; border-radius: 8px; color: var(--muted); font-size: 1.25rem; line-height: 1; cursor: pointer; }
  .tip button:hover { color: var(--text); background: var(--hover); }

  .kbd-hint { margin: 6px 6px 0; font-size: .8125rem; color: var(--dim); line-height: 2; }
  .kbd-hint span { white-space: nowrap; margin-inline-end: 12px; }
  .kbd-hint b {
    display: inline-block;
    min-width: 1.8em;
    padding: 0 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font: 400 .75rem/1.6 ui-monospace, Menlo, Consolas, monospace;
    color: var(--muted);
    text-align: center;
    direction: ltr;
  }

  .open-app {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 12px 0 0;
    padding: 13px 20px;
    border-radius: 14px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
    text-decoration: none;
  }
  .open-app:active { filter: brightness(.94); }
  .open-browser {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 8px 0 0;
    padding: 11px 20px;
    border: 1px solid var(--line-hover);
    border-radius: 14px;
    color: var(--text);
    font-size: .9375rem;
    text-decoration: none;
  }
  .open-browser:active { background: var(--hover); }
  .sp-tip { margin: 12px 2px 0; font-size: .8125rem; color: var(--muted); }

  html[data-mode="standalone"] .install, html[data-mode="standalone"] .tip { display: none !important; }

  /* Telegram Mini App */
  html[data-mode="tg"] body { overscroll-behavior-y: contain; min-height: var(--tg-viewport-stable-height, 100dvh); }
  html[data-mode="tg"] .page {
    padding-top: calc(max(14px, env(safe-area-inset-top)) + var(--tg-inset-top, 0px));
    padding-right: calc(max(16px, env(safe-area-inset-right)) + var(--tg-inset-right, 0px));
    padding-left: calc(max(16px, env(safe-area-inset-left)) + var(--tg-inset-left, 0px));
    padding-bottom: calc(max(40px, env(safe-area-inset-bottom) + 24px) + var(--tg-inset-bottom, 0px));
  }
  html[data-mode="tg"] .install, html[data-mode="tg"] .tip, html[data-mode="tg"] #preview-warning { display: none !important; }
  html[data-mode="tg"] body { -webkit-user-select: none; user-select: none; }
  html[data-mode="tg"] input { -webkit-user-select: text; user-select: text; }

  /* ───────── dark/light, motion and language toggles: icon-only pills ───────── */
  .icon-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: .8125rem;
    font-weight: 700;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .icon-toggle:hover { color: var(--accent-ink); border-color: var(--accent); }
  .icon-toggle svg { width: 18px; height: 18px; flex: none; }
  .icon-toggle [data-ic] { display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
  html[data-device="mobile"] .icon-toggle { width: 42px; height: 42px; }

  /* ───────── light palettes: blue (idle) · green (Spotify) · orange (SoundCloud) ───────── */
  html[data-scheme="light"] {
    color-scheme: light;
    --bg: #eaf2ff;
    --surface: #ffffff;
    --surface-2: #d9e8fb;
    --surface-focus: #ffffff;
    --line: #b9d4f0;
    --line-hover: #7fb1e6;
    --accent: #1f7ae0;
    --on-accent: #ffffff;
    --accent-ink: #0b5fb0;
    --text: #10233c;
    --muted: #46586c;
    --dim: #5d7285;
    --hover: rgba(18,35,60,.07);
    --shadow: rgba(20,55,95,.28);
    --glow: 22%;
    --danger: #c62828;
    --notice-bg: #ffe4e8;
    --notice-line: #e2a1ad;
  }
  html[data-scheme="light"][data-theme="spotify"] {
    --bg: #eef8f2;
    --surface: #ffffff;
    --surface-2: #dcf1e5;
    --surface-focus: #ffffff;
    --line: #b9dcc7;
    --line-hover: #86c4a0;
    --accent: #1ed760;
    --on-accent: #06180d;
    --accent-ink: #0b7a36;
    --text: #0f2418;
    --muted: #46655a;
    --dim: #5d7d6f;
  }
  html[data-scheme="light"][data-theme="soundcloud"] {
    --bg: #fff4ec;
    --surface: #ffffff;
    --surface-2: #ffe5d5;
    --surface-focus: #ffffff;
    --line: #f0c7ac;
    --line-hover: #e29868;
    --accent: #ff5500;
    --on-accent: #190800;
    --accent-ink: #b03a00;
    --text: #2b150a;
    --muted: #6c4e3e;
    --dim: #866553;
  }
  /* iOS home-screen app: the status bar text is always white, so keep a dark strip behind it */
  html.ios[data-mode="standalone"][data-scheme="light"] body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: env(safe-area-inset-top);
    background: #12233c;
    z-index: 100;
  }

  /* ───────── light animations (only transform + opacity, so they stay smooth) ───────── */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes itemIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } }
  @keyframes itemOut { to { opacity: 0; transform: translateX(-26px) scale(.96); } }
  @keyframes swapIn { from { opacity: 0; transform: translateY(8px); } }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @keyframes turn { from { transform: rotate(-120deg) scale(.5); opacity: .3; } }
  @keyframes ring { from { opacity: .5; transform: scale(1); } to { opacity: 0; transform: scale(1.55); } }
  @keyframes breathe { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.09); } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes fade { 50% { opacity: .45; } }

  /* entrance: the page settles in, one piece after another */
  .top { animation: rise .45s cubic-bezier(.16, 1, .3, 1) backwards; }
  .hero h1 { animation: rise .55s cubic-bezier(.16, 1, .3, 1) 70ms backwards; }
  .hero .lead { animation: rise .55s cubic-bezier(.16, 1, .3, 1) 140ms backwards; }
  .hero .field { animation: rise .55s cubic-bezier(.16, 1, .3, 1) 210ms backwards; }
  .hero .hint { animation: rise .55s cubic-bezier(.16, 1, .3, 1) 260ms backwards; }
  .stage { animation: rise .65s cubic-bezier(.16, 1, .3, 1) 320ms backwards; }
  .library { animation: rise .65s cubic-bezier(.16, 1, .3, 1) 400ms backwards; }

  /* lists */
  .track { animation: rise .38s cubic-bezier(.16, 1, .3, 1) calc(var(--i, 0) * 28ms) backwards; }
  .item.enter { animation: itemIn .4s cubic-bezier(.16, 1, .3, 1) backwards; }
  .item.leaving { animation: itemOut .19s ease forwards; pointer-events: none; }
  .np.swap .art, .np.swap .np-text { animation: swapIn .38s cubic-bezier(.16, 1, .3, 1) backwards; }
  .hint.shake { animation: shake .38s ease; }
  .icon-toggle.turn [data-ic] { animation: turn .6s cubic-bezier(.16, 1, .3, 1); }

  /* play button: icon morph + soft ring while music plays */
  .cbtn.play { position: relative; }
  .cbtn.play svg { position: absolute; inset: 0; margin: auto; transition: opacity .3s ease, transform .4s cubic-bezier(.16, 1, .3, 1); }
  .cbtn.play .i-play { opacity: 1; transform: none; }
  .cbtn.play .i-pause { opacity: 0; transform: scale(.5) rotate(-45deg); }
  .is-playing .cbtn.play .i-play { opacity: 0; transform: scale(.5) rotate(45deg); }
  .is-playing .cbtn.play .i-pause { opacity: 1; transform: none; }
  .is-playing .cbtn.play::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--accent);
    pointer-events: none;
    animation: ring 2.4s cubic-bezier(.22, .61, .36, 1) infinite;
  }

  /* tiny equalizer next to the logo while music plays */
  .mini-eq { display: none; align-items: flex-end; gap: 2px; height: 16px; }
  .mini-eq i { display: block; width: 3px; height: 30%; background: var(--accent); border-radius: 1px; transform-origin: bottom; will-change: transform; animation: eq .9s ease-in-out infinite alternate; }
  .mini-eq i:nth-child(2) { animation-delay: -.3s; }
  .mini-eq i:nth-child(3) { animation-delay: -.6s; }
  html.playing .mini-eq { display: inline-flex; }

  /* the glow behind the record breathes while playing */
  .stage.spin::before { animation: breathe 4.4s cubic-bezier(.37, 0, .63, 1) infinite; }

  /* idle + loading states */
  .empty strong { animation: bob 3.6s ease-in-out infinite; }
  .art { position: relative; }
  .cp.loading .art::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.2) 50%, transparent 80%);
    animation: sweep 1.25s ease-in-out infinite;
  }
  .track.pending:nth-child(-n+14) .track-title { animation: fade 1.4s ease-in-out infinite; }

  /* everything you tap feels pressable */
  .social a, .icon-toggle, .install { transition: color .2s ease, border-color .2s ease, background-color .2s ease, transform .25s cubic-bezier(.16, 1, .3, 1); }
  .cbtn, .icon-btn { transition: background-color .2s ease, opacity .2s ease, color .2s ease, transform .25s cubic-bezier(.16, 1, .3, 1); }
  .track-btn, .item-main { transition: background-color .2s ease, transform .2s cubic-bezier(.16, 1, .3, 1); }
  .open-app, .open-browser { transition: transform .2s cubic-bezier(.16, 1, .3, 1), filter .2s ease, background-color .2s ease; }
  .social a:active, .icon-toggle:active, .install:active, .cbtn:active:not(:disabled), .icon-btn:active { transform: scale(.96); }
  .track-btn:active, .item-main:active, .open-app:active, .open-browser:active { transform: scale(.98); }
  @media (hover: hover) { .social a:hover, .icon-toggle:hover, .install:hover { transform: translateY(-1px); } }

  .field input { transition: border-color .15s, background-color .4s, box-shadow .25s; }
  .field input:focus { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }

  /* colors ease over when the theme changes (purple / green / orange) */
  .lead, .hint, .caption, .item-meta, .np-artist, .track-artist, .time, .lib-note, .lib-empty, .sp-hint, .sp-tip, h1, h2, .brand { transition: color .5s ease; }

  /* weaker phones: keep only the cheap effects */
  html[data-perf="low"] .stage.spin::before,
  html[data-perf="low"] .empty strong,
  html[data-perf="low"] .cp.loading .art::after,
  html[data-perf="low"] .track.pending .track-title,
  html[data-perf="low"] .is-playing .cbtn.play::after,
  html[data-perf="low"] .track { animation: none; }

  /* people who asked their device for less motion get none */
  html[data-motion="reduced"] *, html[data-motion="reduced"] *::before, html[data-motion="reduced"] *::after {
    animation-duration: .001ms !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    transition-delay: 0s !important;
  }
</style>
</head>
<body>
<div class="bg-deco" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="spark"></span><span class="mote m1"></span><span class="mote m2"></span><span class="mote m3"></span><span class="mote m4"></span></div>
<div class="page">

  <p id="preview-warning" class="notice" role="alert" hidden data-i18n="previewWarning"></p>

  <header class="top">
    <span class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle class="b-disc" cx="16" cy="16" r="15"/>
        <circle class="b-ring" cx="16" cy="16" r="10" stroke-width="1"/>
        <circle class="b-label" cx="16" cy="16" r="5.5"/>
        <circle class="b-hole" cx="16" cy="16" r="1.4"/>
      </svg>
      <span data-i18n="brandName"></span>
      <span class="mini-eq" aria-hidden="true"><i></i><i></i><i></i></span>
    </span>

    <nav class="toolbar" aria-label="تنظیمات نمایش">
      <button type="button" id="scheme-btn" class="icon-toggle" aria-label="حالت نمایش" title="حالت نمایش"><span data-ic></span></button>
      <button type="button" id="lang-btn" class="icon-toggle" aria-label="زبان: فارسی" title="زبان">
        <span data-ic>فا</span>
      </button>
      <button type="button" id="install-btn" class="install" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        <span data-i18n="installApp">نصب اپ</span>
      </button>
    </nav>
  </header>

  <div id="ios-tip" class="tip" hidden>
    <span data-i18n-html="iosTip"></span>
    <button type="button" id="tip-close" aria-label="بستن" data-i18n-aria="close">×</button>
  </div>

  <section class="hero">
    <h1 data-i18n="heroTitle"></h1>
    <p class="lead" data-i18n="heroLead"></p>

    <form id="form" class="field" autocomplete="off" novalidate>
      <input id="link" type="text" dir="auto" inputmode="url" spellcheck="false"
             enterkeyhint="go" aria-describedby="msg"
             data-i18n-placeholder="linkPlaceholder" data-i18n-aria="linkAria">
      <button type="submit" data-i18n="playBtn"></button>
    </form>
    <p id="msg" class="hint" role="status" data-i18n="defaultHint"></p>
  </section>

  <main class="layout">

    <div class="stage idle" id="stage">
      <div class="record-clip" aria-hidden="true">
        <div class="record-slide">
          <div class="record">
            <div class="label"><span class="mark"></span></div>
            <div class="hole"></div>
          </div>
        </div>
      </div>

      <div class="sleeve">
        <div id="empty" class="empty">
          <strong data-i18n="emptyTitle"></strong>
          <span data-i18n="emptyText"></span>
        </div>
        <div id="player" class="player"></div>
      </div>
      <p id="caption" class="caption"></p>
      <p id="fallback" class="caption" hidden></p>
      <p id="kbd" class="kbd-hint" hidden></p>
    </div>

    <aside class="library" aria-labelledby="lib-title">

    const host = u.hostname.replace(/^www\./, '').toLowerCase();

    if (host === 'open.spotify.com') {
      const parts = u.pathname.split('/').filter(Boolean).filter((p) => !/^intl-/i.test(p));
      if (parts[0] === 'embed') parts.shift();
      const [type, id] = parts;
      if (/^(playlist|album|track|artist|show|episode)$/.test(type || '') && /^[A-Za-z0-9]+$/.test(id || '')) {
        return { source: 'spotify', type, id, url: `https://open.spotify.com/${type}/${id}` };
      }
      return null;
    }

    if (host === 'soundcloud.com' || host === 'm.soundcloud.com' || host === 'on.soundcloud.com') {
      const parts = u.pathname.split('/').filter(Boolean);
      if (!parts.length) return null;
      const h = host === 'm.soundcloud.com' ? 'soundcloud.com' : host;
      if (h === 'on.soundcloud.com') return { source: 'soundcloud', type: 'link', url: `https://${h}${u.pathname}` };
      if (SC_SYSTEM.has(parts[0])) return { error: 'system' };
      const secret = u.searchParams.get('secret_token');
      const tail = secret ? `?secret_token=${encodeURIComponent(secret)}` : '';
      let path = parts;
      if (parts.length === 2 && SC_TABS.has(parts[1])) path = [parts[0]];
      let type = 'track';
      if (path.includes('sets')) type = 'set';
      else if (path.length === 1) type = 'profile';
      return { source: 'soundcloud', type, url: `https://soundcloud.com/${path.join('/')}${tail}` };
    }
    return null;
  }

  /* ── oEmbed helpers ── */
  async function getJson(url, ms) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms || 6000);
    try {
      const r = await fetch(url, { signal: ctrl.signal });
      if (!r.ok) return null;
      return await r.json();
    } catch { return null; } finally { clearTimeout(t); }
  }

  // Spotify: title + cover for any playlist / album / track link (cached)
  const spMetaCache = new Map();
  function spotifyMeta(url) {
    if (spMetaCache.has(url)) return spMetaCache.get(url);
    const p = (async () => {
      const q = encodeURIComponent(url);
      const endpoints = [
        `https://open.spotify.com/oembed?url=${q}`,
        `https://embed.spotify.com/oembed?url=${q}`
      ];
      if (USE_PROXY) endpoints.push('https://api.allorigins.win/raw?url=' + encodeURIComponent(endpoints[0]));
      for (const ep of endpoints) {
        const j = await getJson(ep, 5000);
        if (j && (j.title || j.thumbnail_url)) {
          return { title: (j.title || '').trim() || null, thumb: isHttps(j.thumbnail_url) ? j.thumbnail_url : null };
        }
      }
      return null;
    })();
    spMetaCache.set(url, p);
    p.then((m) => { if (!m) spMetaCache.delete(url); });
    return p;
  }

  // SoundCloud: title / artist / cover of a track known only by its id
  async function scMeta(id) {
    const j = await getJson('https://soundcloud.com/oembed?format=json&url=' + encodeURIComponent('https://api.soundcloud.com/tracks/' + id), 6000);
    if (!j || !j.title) return null;
    let title = String(j.title);
    const artist = j.author_name ? String(j.author_name) : '';
    if (artist && title.endsWith(' by ' + artist)) title = title.slice(0, -(artist.length + 4));
    const out = { title };
    if (artist) out.user = { username: artist };
    if (isHttps(j.thumbnail_url)) out.artwork_url = j.thumbnail_url;
    return out;
  }

  /* ── on.soundcloud.com short links → real embeddable URL (best effort) ── */
  async function resolveShort(p) {
    const j = await getJson('https://soundcloud.com/oembed?format=json&url=' + encodeURIComponent(p.url), 8000);
    if (!j) return null;
    const m = /src="([^"]+)"/.exec(j.html || '');
    if (!m) return null;
    let embedded = null;
    try { embedded = new URL(m[1].replace(/&amp;/g, '&')).searchParams.get('url'); } catch {}
    if (!embedded) return null;
    const type = /\/playlists\//.test(embedded) ? 'set' : /\/users\//.test(embedded) ? 'profile' : 'track';
    return { source: 'soundcloud', type, url: embedded, openUrl: p.url, title: (j.title || '').trim() || null };
  }

  /* ── official iframes ── */
  function buildFrame(item, visual) {
    const f = document.createElement('iframe');
    f.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
    f.allowFullscreen = true;
    f.title = item.title || 'پلیر';

    if (item.source === 'spotify') {
      f.src = `https://open.spotify.com/embed/${item.type}/${item.id}?utm_source=generator${docEl.dataset.scheme === 'light' ? '' : '&theme=0'}`;
      f.style.height = ((item.type === 'track' || item.type === 'episode') ? 152 : 380) + 'px';
    } else {
      const compact = item.type === 'track';
      const q = new URLSearchParams({
        url: item.url, color: '#ff5500', auto_play: 'false', hide_related: 'true',
        show_comments: 'false', show_user: 'true', show_reposts: 'false', show_teaser: 'false',
        visual: (visual && !compact) ? 'true' : 'false'
      });
      f.src = `https://w.soundcloud.com/player/?${q}`;
      f.style.height = (compact ? 166 : 380) + 'px';
    }
    return f;
  }

  const svg = (inner, extra = '') =>
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${inner}</svg>`;
  const fillRange = (el) => el.style.setProperty('--p', (Number(el.value) / Number(el.max) * 100) + '%');

  function makeArt(container, url) {
    container.replaceChildren();
    if (!isHttps(url)) return;
    const img = new Image();
    img.alt = '';
    img.referrerPolicy = 'no-referrer';
    img.onerror = () => img.remove();
    img.src = url;
    container.append(img);
  }

  /* ───────────────── SoundCloud: custom player on top of the Widget API ───────────────── */
  let scApiPromise = null;
  function loadScApi() {
    if (window.SC && window.SC.Widget) return Promise.resolve();
    if (!scApiPromise) {
      scApiPromise = new Promise((resolve, reject) => {
        const timer = setTimeout(() => { scApiPromise = null; reject(new Error('timeout')); }, 8000);
        const s = document.createElement('script');
        s.src = 'https://w.soundcloud.com/player/api.js';
        s.onload = () => { clearTimeout(timer); resolve(); };
        s.onerror = () => { clearTimeout(timer); scApiPromise = null; reject(new Error('blocked')); };
        document.head.append(s);
      });
    }
    return scApiPromise;
  }

  const CP_TEMPLATE = `
    <div class="np">
      <div class="art" data-art></div>
      <div class="np-text">
        <div class="np-title" data-title dir="auto"></div>
        <div class="np-artist" data-artist dir="auto"></div>

      </div>
    </div>
    <div class="seek">
      <span class="time" data-pos>0:00</span>

          ${svg('<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>', 'class="i-pause"')}
        </button>

      </div>
      <label class="vol">
        ${svg('<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>')}

  function createScPlayer(item, { onPlaying }) {
    const root = document.createElement('div');
    root.className = 'cp loading';
    root.innerHTML = CP_TEMPLATE;
    applyI18n(root);
    const q = (s) => root.querySelector(s);
    const els = {
      art: q('[data-art]'), title: q('[data-title]'), artist: q('[data-artist]'), link: q('[data-link]'),
      seek: q('[data-seek]'), pos: q('[data-pos]'), dur: q('[data-dur]'),
      prev: q('[data-prev]'), play: q('[data-play]'), next: q('[data-next]'),
      vol: q('[data-vol]'), tracks: q('[data-tracks]')
    };

    // The official widget stays invisible and only produces the sound.
    const frame = buildFrame(item, false);
    const official = document.createElement('div');
    official.className = 'official off';
    official.append(frame);

    const foot = document.createElement('div');
    foot.className = 'foot';
    const note = document.createElement('span');
    note.className = 'note';
    note.hidden = true;
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'linkbtn';
    toggle.textContent = tr('scShowOfficial');
    foot.append(note, toggle);

    let W = null, ready = false, dead = false, readyTimer = null, playWatch = null, autoRevealed = false;
    let sounds = [], idx = 0, dur = 0, dragging = false, curPos = 0, prevVol = 80;
    const rows = [];
    let vol = Number(read(LS_VOL, 80));
    if (!(vol >= 0 && vol <= 100)) vol = 80;
    els.vol.value = vol;
    fillRange(els.vol);
    fillRange(els.seek);
    els.title.textContent = tr('scPreparing');

    function showOfficial(visible) {
      official.classList.toggle('off', !visible);
      root.hidden = visible;
      toggle.textContent = visible ? tr('scBackToOurs') : tr('scShowOfficial');
    }
    toggle.addEventListener('click', () => { autoRevealed = false; note.hidden = true; showOfficial(official.classList.contains('off')); });

    function fail(text) {
      if (dead) return;
      clearTimeout(readyTimer);
      root.classList.remove('loading');
      showOfficial(true);
      note.textContent = text;
      note.classList.remove('info');
      note.hidden = false;

    }

    function setPlaying(p) {

    }

    /* Phones (especially iPhone / Telegram) don't let a page start audio inside another
       site's iframe. If nothing starts, show the official player once so a single tap there
       unlocks playback, then go back to the gramafon UI. */
    function requestPlay(action) {
      action();
      if (root.classList.contains('is-playing')) return;
      clearTimeout(playWatch);
      playWatch = setTimeout(() => {
        if (dead || root.classList.contains('is-playing')) return;
        autoRevealed = true;
        showOfficial(true);
        note.textContent = tr('scNoAudioBlocked');
        note.classList.add('info');
        note.hidden = false;
      }, 1500);
    }

    function updateRow(i) {
      const r = rows[i], s = sounds[i];
      if (!r || !s) return;
      r.title.textContent = s.title || `${tr('scPreparing').split('…')[0]} ${i + 1}`;
      r.artist.textContent = s.user && s.user.username ? s.user.username : '';
      r.time.textContent = s.duration ? fmt(s.duration) : '';
      r.li.classList.toggle('pending', !s.title);
    }

    function showTrack() {
      const s = sounds[idx];
      els.title.textContent = s && s.title ? s.title : (s ? `${tr('scPreparing').split('…')[0]} ${idx + 1}` : tr('scPreparing'));
      els.artist.textContent = s && s.user ? (s.user.username || '') : '';
      makeArt(els.art, s && (s.artwork_url || (s.user && s.user.avatar_url)) ? String(s.artwork_url || s.user.avatar_url).replace('-large.', '-t300x300.') : null);
      if (s && isHttps(s.permalink_url)) { els.link.href = s.permalink_url; els.link.hidden = false; }
      else els.link.hidden = true;
      if (s && s.duration) dur = s.duration;
      els.dur.textContent = fmt(dur);
      rows.forEach((r, i) => r.li.classList.toggle('current', i === idx));
      const many = sounds.length > 1;
      els.prev.disabled = !ready || !many;
      els.next.disabled = !ready || !many;
      pushMediaState({
        source: 'soundcloud',
        title: els.title.textContent,
        artist: els.artist.textContent,
        artwork: s && (s.artwork_url || (s.user && s.user.avatar_url)) ? String(s.artwork_url || s.user.avatar_url).replace('-large.', '-t300x300.') : null,
        canNext: many, canPrev: many
      });
    }

    // merge fuller data (e.g. from getCurrentSound / oEmbed) into a partially loaded track
    function mergeSound(i, s) {
      if (!s || dead) return;
      sounds[i] = Object.assign({}, sounds[i] || {}, s);
      updateRow(i);
      if (i === idx) showTrack();
    }

    function renderTracks() {
      els.tracks.replaceChildren();
      rows.length = 0;
      els.tracks.hidden = sounds.length < 2;
      sounds.forEach((s, i) => {
        const li = document.createElement('li');
        li.className = 'track';
        li.style.setProperty('--i', String(Math.min(i, 12)));
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'track-btn';

        const num = document.createElement('span');
        num.className = 'track-num';
        const n = document.createElement('b');
        n.textContent = String(i + 1);
        const eq = document.createElement('span');
        eq.className = 'eq';
        eq.innerHTML = '<i></i><i></i><i></i>';
        num.append(n, eq);

        const text = document.createElement('span');
        text.className = 'track-text';
        const t = document.createElement('span');
        t.className = 'track-title';
        t.dir = 'auto';
        const a = document.createElement('span');
        a.className = 'track-artist';
        a.dir = 'auto';
        text.append(t, a);

        const time = document.createElement('span');
        time.className = 'track-time';

        b.append(num, text, time);
        b.addEventListener('click', () => {
          if (W && ready) requestPlay(() => { W.skip(i); W.play(); });
        });
        li.append(b);
        els.tracks.append(li);
        rows[i] = { li, title: t, artist: a, time };
        updateRow(i);
      });
    }

    function syncIndex() {
      if (!W || !ready) return;
      W.getCurrentSoundIndex((i) => {
        if (typeof i !== 'number' || i < 0) return;
        const changed = i !== idx;
        idx = i;
        if (changed) { showTrack(); pulse(q('.np'), 'swap'); }
        W.getCurrentSound((s) => mergeSound(idx, s));
      });
    }

    // SoundCloud only sends full details for the first few tracks of a playlist.
    const stubs = () => sounds.map((s, i) => (!s || !s.title ? i : -1)).filter((i) => i >= 0);
    async function hydrate() {
      for (let n = 0; n < 3 && !dead && stubs().length; n++) {
        await sleep(1500);
        await new Promise((res) => {
          W.getSounds((found) => {
            (found || []).forEach((s, i) => { if (s && s.title && sounds[i] && !sounds[i].title) mergeSound(i, s); });
            res();
          });
          setTimeout(res, 1200);
        });
      }
      const todo = stubs().filter((i) => sounds[i] && sounds[i].id);
      let cursor = 0;
      const worker = async () => {
        while (!dead && cursor < todo.length) {
          const i = todo[cursor++];
          const m = await scMeta(sounds[i].id);
          if (m) mergeSound(i, m);
        }
      };
      await Promise.all([worker(), worker(), worker()]);
    }

    function gotSounds(found) {
      sounds = found.slice();
      W.getCurrentSoundIndex((i) => {
        idx = typeof i === 'number' && i >= 0 && i < sounds.length ? i : 0;
        renderTracks();
        els.play.disabled = false;
        els.seek.disabled = false;
        showTrack();
        root.classList.remove('loading');
        if (stubs().length) hydrate();
      });
    }

    function loadSounds(attempt) {
      if (dead) return;
      W.getSounds((found) => {
        if (found && found.length) { gotSounds(found); return; }
        W.getCurrentSound((s) => {
          if (s) { gotSounds([s]); return; }
          if (attempt < 3) setTimeout(() => loadSounds(attempt + 1), 800);
          else fail(tr('scNoResults'));
        });
      });
    }

    function start() {
      if (!window.SC || !window.SC.Widget) { fail(tr('scPlayerFailed')); return; }
      W = window.SC.Widget(frame);
      const E = window.SC.Widget.Events;

      W.bind(E.READY, () => {
        if (dead) return;
        ready = true;
        clearTimeout(readyTimer);
        W.setVolume(vol);
        loadSounds(0);
      });
      W.bind(E.PLAY, () => {
        clearTimeout(playWatch);
        setPlaying(true);
        syncIndex();
        if (autoRevealed) {
          autoRevealed = false;
          setTimeout(() => { if (!dead) { showOfficial(false); note.hidden = true; } }, 700);
        }
      });
      W.bind(E.PAUSE, () => setPlaying(false));
      W.bind(E.FINISH, () => { setPlaying(false); syncIndex(); });
      W.bind(E.PLAY_PROGRESS, (e) => {
        curPos = e.currentPosition || 0;
        if (dragging) return;
        els.seek.value = Math.round((e.relativePosition || 0) * 1000);
        fillRange(els.seek);
        els.pos.textContent = fmt(e.currentPosition);
      });
      W.bind(E.ERROR, () => fail(tr('scPlaybackError')));

      readyTimer = setTimeout(() => {
        if (!ready) fail(tr('scNotReady'));
      }, 12000);
    }

    els.play.addEventListener('click', () => { if (W && ready) requestPlay(() => W.toggle()); });
    els.next.addEventListener('click', () => { if (W && ready) W.next(); });
    els.prev.addEventListener('click', () => { if (W && ready) W.prev(); });

    function setVol(v) {
      vol = Math.max(0, Math.min(100, Math.round(v)));
      els.vol.value = vol;
      fillRange(els.vol);
      if (W && ready) W.setVolume(vol);
      write(LS_VOL, vol);
    }
    els.vol.addEventListener('input', () => setVol(Number(els.vol.value)));

    function key(k) {
      if (!W || !ready) return false;
      switch (k) {
        case ' ': case 'k': case 'K': requestPlay(() => W.toggle()); return true;
        case 'ArrowRight': if (!dur) return false; W.seekTo(Math.min(dur, curPos + 10000)); return true;
        case 'ArrowLeft': if (!dur) return false; W.seekTo(Math.max(0, curPos - 10000)); return true;
        case 'ArrowUp': setVol(vol + 5); return true;
        case 'ArrowDown': setVol(vol - 5); return true;
        case 'n': case 'N': W.next(); return true;
        case 'p': case 'P': W.prev(); return true;
        case 'm': case 'M': if (vol > 0) { prevVol = vol; setVol(0); } else setVol(prevVol || 80); return true;
      }
      return false;
    }

    els.seek.addEventListener('input', () => {
      dragging = true;
      fillRange(els.seek);
      els.pos.textContent = fmt(Number(els.seek.value) / 1000 * dur);
    });
    els.seek.addEventListener('change', () => {
      if (W && ready && dur) W.seekTo(Number(els.seek.value) / 1000 * dur);
      dragging = false;
    });

    return {
      root, official, foot, start, key,
      pause() { try { if (W && ready) W.pause(); } catch {} },
      destroy() { dead = true; clearTimeout(readyTimer); clearTimeout(playWatch); this.pause(); }
    };
  }

  /* ───────────────── Spotify: status + seek on top of the official embed ───────────────── */
  let spApiPromise = null;
  function loadSpotifyApi() {

  const SP_TEMPLATE = `
    <div class="np">
      <div class="art" data-art></div>
      <div class="np-text">
        <div class="np-title" data-title dir="auto"></div>
        <div class="np-artist" data-artist dir="auto"></div>

  function createSpPlayer(item, api, { onPlaying }) {

      spotifyMeta(`https://open.spotify.com/${m[1]}/${m[2]}`).then((meta) => {
        if (dead || currentUri !== uri) return;

        els.artist.textContent = isCollection ? containerTitle : typeLine;
        pushMediaState({ source: 'spotify', title: els.title.textContent, artist: els.artist.textContent, artwork: meta.thumb || null, canNext: false, canPrev: false });
      });
    }

    function start() {
      const height = (item.type === 'track' || item.type === 'episode') ? 152 : 352;
      api.createController(placeholder, { uri: `spotify:${item.type}:${item.id}`, width: '100%', height }, (ctrl) => {
        if (dead) { try { ctrl.destroy(); } catch {} return; }
        C = ctrl;
        ctrl.addListener('ready', () => { ready = true; });
        ctrl.addListener('playback_started', (e) => trackChanged(e && e.data && e.data.playingURI));
        ctrl.addListener('playback_update', (e) => {
          const d = e && e.data;
          if (!d) return;
          trackChanged(d.playingURI);
          dur = Number(d.duration) || 0;
          const pos = Number(d.position) || 0;
          posMs = pos;
          els.dur.textContent = fmt(dur);
          els.seek.disabled = !dur;
          if (!dragging) {
            els.pos.textContent = fmt(pos);
            els.seek.value = dur ? Math.round(Math.min(1, pos / dur) * 1000) : 0;
            fillRange(els.seek);
          }
          const p = d.isPaused === false;
          if (p !== playing) { playing = p; onPlaying(p); }
        });
      });
    }

    els.seek.addEventListener('input', () => {
      dragging = true;
      fillRange(els.seek);
      els.pos.textContent = fmt(Number(els.seek.value) / 1000 * dur);
    });
    els.seek.addEventListener('change', () => {
      if (C && dur) { try { C.seek(Math.round(Number(els.seek.value) / 1000 * dur / 1000)); } catch {} }
      dragging = false;
    });

    function key(k) {
      if (!C) return false;
      if (k === ' ' || k === 'k' || k === 'K') { try { C.togglePlay(); return true; } catch { return false; } }
      if (!dur || (k !== 'ArrowRight' && k !== 'ArrowLeft')) return false;
      const target = k === 'ArrowRight' ? Math.min(dur, posMs + 10000) : Math.max(0, posMs - 10000);
      try { C.seek(Math.round(target / 1000)); } catch { return false; }
      return true;
    }

    return {
      root, start, key,
      isReady: () => ready,
      pause() { try { if (C) C.pause(); } catch {} },
      destroy() { dead = true; this.pause(); }
    };
  }

  // one place that reacts to "music is playing / stopped"
  function setPlayingUi(p) {
    stage.classList.toggle('spin', p);
    docEl.classList.toggle('playing', p);
    pushMediaState({ playing: p });
  }

  // tells the Android app's notification what's playing (a no-op everywhere else: on the
  // regular website and inside the iOS/desktop apps, window.AndroidBridge doesn't exist)
  let mediaState = { title: '', artist: '', artwork: null, source: '', playing: false, canNext: false, canPrev: false };
  function pushMediaState(patch) {
    mediaState = Object.assign({}, mediaState, patch);
    if (window.AndroidBridge && window.AndroidBridge.postState) {
      try { window.AndroidBridge.postState(JSON.stringify(mediaState)); } catch {}
    }
  }

  // the Android notification's buttons call these (see MainActivity.runJs)
  window.gramafonControl = {
    toggle() { if (active && active.key) active.key(' '); },
    next() { if (active && active.key) active.key('n'); },
    prev() { if (active && active.key) active.key('p'); }
  };

  // phones and Telegram: Spotify's embedded player usually only gives 30-second previews there
  // Chrome's "Desktop site" on a phone sends a desktop user-agent; Spotify's player then gives full playback
  const desktopSiteOnPhone = touchOnly && !mobileUA && !IS_IOS && !IS_ANDROID;
  const compactMode = () => (docEl.dataset.device === 'mobile' && !desktopSiteOnPhone) || docEl.dataset.mode === 'tg';
  function openAppLink(item) {
    const a = document.createElement('a');
    a.className = 'open-app';
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = tr('playFullInApp');
    return a;
  }

  /* ── keyboard shortcuts (desktop only) ── */
  const kbd = $('#kbd');
  function setKbdHint(kind) {
    kbd.replaceChildren();
    if (!kind || docEl.dataset.device !== 'desktop') { kbd.hidden = true; return; }
    const items = kind === 'sc'
      ? [['Space', tr('kbdPlayPause')], ['← →', tr('kbdSeek')], ['↑ ↓', tr('kbdVolume')], ['N / P', tr('kbdNextPrev')], ['M', tr('kbdMute')]]
      : [['← →', tr('kbdSeek')]];
    kbd.append(document.createTextNode(tr('shortcutsLabel')));
    items.forEach(([k, t]) => {
      const span = document.createElement('span');
      const b = document.createElement('b');
      b.textContent = k;
      span.append(b, document.createTextNode(' ' + t));
      kbd.append(span);
    });
    kbd.hidden = false;
  }

  document.addEventListener('keydown', (e) => {
    if (docEl.dataset.device !== 'desktop' || !active || !active.key) return;
    if (e.ctrlKey || e.metaKey || e.altKey || e.defaultPrevented) return;
    const t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    if ((e.key === ' ' || e.key === 'Enter') && (tag === 'BUTTON' || tag === 'A')) return;
    if (active.key(e.key)) e.preventDefault();
  });

  /* ── mounting a source into the sleeve ── */
  function showFallback(item, notLoaded) {
    fallback.replaceChildren();
    if (notLoaded) {
      const w = document.createElement('span');
      w.className = 'warn';
      w.textContent = tr('fallbackLoading');
      fallback.append(w);
    }
    const a = document.createElement('a');
    a.href = item.openUrl || item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = tr('openOn') + SOURCES[item.source].name;
    fallback.append(document.createTextNode(notLoaded ? '' : tr('fallbackProblem')), a);
    fallback.hidden = false;
  }

  function mountSpotifyPlain(item, note) {
    player.replaceChildren(buildFrame(item));
    stage.classList.add('spin');
    if (compactMode()) {
      caption.textContent = tr('compactSpHint');
      fallback.replaceChildren(openAppLink(item));
      fallback.hidden = false;
    } else {
      caption.textContent = note || SPOTIFY_NOTE;
    }
  }

  async function mountSpotify(item, token) {
    stage.classList.remove('spin');
    docEl.classList.remove('playing');
    caption.textContent = compactMode() ? '' : SPOTIFY_NOTE;
    if (!compactMode()) showFallback(item, false);
    let api;
    try {
      api = await loadSpotifyApi();
    } catch {
      if (token === mountToken) mountSpotifyPlain(item, tr('spotifyNoteExtra') + SPOTIFY_NOTE);
      return;
    }
    if (token !== mountToken) return;
    const sp = createSpPlayer(item, api, {
      onPlaying: (p) => { if (token === mountToken) setPlayingUi(p); }
    });
    active = sp;
    player.replaceChildren(sp.root);
    sp.start();
    setKbdHint('sp');
    setTimeout(() => { if (token === mountToken && !sp.isReady() && !compactMode()) showFallback(item, true); }, 10000);
  }

  function mountOfficialOnly(item, note) {
    player.replaceChildren(buildFrame(item, true));
    caption.textContent = note;
    stage.classList.add('spin');
  }

  async function mountSoundCloud(item, token) {
    stage.classList.remove('spin');
    docEl.classList.remove('playing');
    caption.textContent = tr('scPreparingPlayer');
    showFallback(item, false);
    try {
      await loadScApi();
    } catch {
      if (token === mountToken) mountOfficialOnly(item, 'پلیر اختصاصی لود نشد (اینترنت یا فیلترشکن رو چک کن). پلیر اصلی ساندکلود نمایش داده شد.');
      return;
    }
    if (token !== mountToken) return;
    caption.textContent = '';
    const sc = createScPlayer(item, {
      onPlaying: (p) => { if (token === mountToken) setPlayingUi(p); }
    });
    active = sc;
    player.replaceChildren(sc.root, sc.official, sc.foot);
    sc.start();
    setKbdHint('sc');
  }

  function play(item) {
    currentKey = item.key;
    write(LS_LAST, currentKey);
    const token = ++mountToken;
    render();
    if (active) active.pause();

    const mount = () => {
      if (token !== mountToken) return;
      if (active) { active.destroy(); active = null; }
      setTheme(item.source);
      setKbdHint(null);
      pushMediaState({ title: item.title, artist: '', artwork: null, source: item.source, playing: false, canNext: false, canPrev: false });
      stage.classList.remove('idle');
      empty.hidden = true;
      caption.textContent = '';
      fallback.hidden = true;
      stage.classList.add('out');
      if (item.source === 'spotify') mountSpotify(item, token);
      else mountSoundCloud(item, token);
    };

    clearTimeout(swapTimer);
    if (stage.classList.contains('out') && !isReduced()) {
      stage.classList.remove('out', 'spin');   // record slides back in…
      docEl.classList.remove('playing');
      swapTimer = setTimeout(mount, 450);      // …then the new one comes out
    } else {
      mount();
    }
  }

  /* ── titles for the library (best effort; falls back to a generic name) ── */
  async function fetchTitle(item) {
    if (item.source === 'spotify') {
      const m = await spotifyMeta(item.url);
      return m && m.title ? m.title : null;
    }
    const j = await getJson('https://soundcloud.com/oembed?format=json&url=' + encodeURIComponent(item.url), 6000);
    return j && j.title ? String(j.title).trim() || null : null;
  }

  const persist = () => write(LS_LIB, library);
  const defaultTitle = (p) => `${TYPES[p.type]} ${SOURCES[p.source].name}`;

  /* ── library UI ── */
  const ICON_EDIT = svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>');
  const ICON_TRASH = svg('<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>');

  function iconButton(icon, label, cls, onClick) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'icon-btn' + (cls ? ' ' + cls : '');
    b.setAttribute('aria-label', label);
    b.title = label;
    b.innerHTML = icon;
    b.addEventListener('click', onClick);
    return b;
  }

  function render() {
    list.replaceChildren();
    libEmpty.hidden = library.length > 0;

    library.forEach((item) => {
      const li = document.createElement('li');
      li.className = 'item' + (item.key === currentKey ? ' active' : '') + (item.key === justAddedKey ? ' enter' : '');

      const main = document.createElement('button');
      main.type = 'button';
      main.className = 'item-main';
      main.addEventListener('click', () => play(item));

      const dot = document.createElement('span');
      dot.className = 'src-dot';
      dot.style.background = SOURCES[item.source].color;

      const text = document.createElement('span');
      text.className = 'item-text';
      const title = document.createElement('span');
      title.className = 'item-title';
      title.dir = 'auto';
      title.textContent = item.title;
      const meta = document.createElement('span');
      meta.className = 'item-meta';
      meta.textContent = `${TYPES[item.type] || tr('typeLink')} \u2013 ${SOURCES[item.source].name}`;
      text.append(title, meta);
      main.append(dot, text);

      const actions = document.createElement('span');
      actions.className = 'item-actions';
      actions.append(
        iconButton(ICON_EDIT, tr('renameLabel'), '', () => {
          const n = prompt(tr('renamePrompt'), item.title);
          if (n && n.trim()) { item.title = n.trim(); item.auto = false; persist(); render(); }
        }),
        iconButton(ICON_TRASH, tr('deleteLabel'), 'danger', () => {
          if (li.classList.contains('leaving')) return;
          li.classList.add('leaving');
          const finish = () => { library = library.filter((i) => i !== item); persist(); render(); };
          if (isReduced()) finish(); else setTimeout(finish, 190);
        })
      );

      li.append(main, actions);
      list.append(li);
    });
    justAddedKey = null;
  }

  /* ── form ── */
  function say(text, isError) {
    msg.textContent = text;
    msg.classList.toggle('error', !!isError);
    if (isError) pulse(msg, 'shake');
  }

  function addAndPlay(parsed) {
    const key = `${parsed.source}|${parsed.url}`;
    let item = library.find((i) => i.key === key);
    if (item) {
      library = [item, ...library.filter((i) => i !== item)];
    } else {
      item = { ...parsed, key, title: parsed.title || defaultTitle(parsed), auto: !parsed.title };
      library.unshift(item);
      justAddedKey = key;
      if (item.auto) {
        fetchTitle(item).then((t) => {
          if (t && item.auto) { item.title = t; persist(); render(); }
        });
      }
    }
    persist();
    play(item);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!input.value.trim()) { say(tr('errNoLink'), true); input.focus(); return; }

    let parsed = parseLink(input.value);
    if (!parsed) {
      say(tr('errBadLink'), true);
      return;
    }
    if (parsed.error) {
      say(tr('errSystemPage'), true);
      return;
    }
    if (parsed.type === 'link') {
      say(tr('resolvingShort'), false);
      parsed = await resolveShort(parsed);
      if (!parsed) {
        say(tr('errShortLink'), true);
        return;
      }
    }
    say(DEFAULT_HINT, false);

    addAndPlay(parsed);
    input.value = '';
    input.blur();
  });

  input.addEventListener('input', () => { if (msg.classList.contains('error')) say(DEFAULT_HINT, false); });

  // pasting a valid link starts playing right away
  input.addEventListener('paste', () => {
    setTimeout(() => { if (parseLink(input.value)) form.requestSubmit(); }, 0);
  });

  /* ── dark / light / auto ── */
  const SCHEME_KEY = 'gramafon:scheme';
  const SCHEMES = ['dark', 'light', 'auto'];
  const SCHEME_LABEL_KEY = { dark: 'schemeDark', light: 'schemeLight', auto: 'schemeAuto' };
  const SCHEME_ICON = {
    dark: svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
    light: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
    auto: svg('<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>')
  };
  const schemeBtn = $('#scheme-btn');
  const mqLight = window.matchMedia('(prefers-color-scheme: light)');
  let schemePref = read(SCHEME_KEY, 'dark');
  if (!SCHEMES.includes(schemePref)) schemePref = 'dark';

  function applyScheme() {
    docEl.dataset.scheme = schemePref === 'auto' ? (mqLight.matches ? 'light' : 'dark') : schemePref;
    docEl.dataset.schemePref = schemePref;
    schemeBtn.querySelector('[data-ic]').innerHTML = SCHEME_ICON[schemePref];
    schemeBtn.title = tr(SCHEME_LABEL_KEY[schemePref]);
    schemeBtn.setAttribute('aria-label', tr('schemeAria') + ': ' + tr(SCHEME_LABEL_KEY[schemePref]) + tr('changeHint'));
    applyBarColors();
  }
  schemeBtn.addEventListener('click', () => {
    schemePref = SCHEMES[(SCHEMES.indexOf(schemePref) + 1) % SCHEMES.length];
    write(SCHEME_KEY, schemePref);
    pulse(schemeBtn, 'turn');
    if (document.startViewTransition && !isReduced() && docEl.dataset.perf !== 'low') document.startViewTransition(applyScheme);
    else applyScheme();
  });
  try { mqLight.addEventListener('change', () => { if (schemePref === 'auto') applyScheme(); }); } catch {}
  applyScheme();

  /* ── motion: always on, but quietly optimized for low-end devices and for people
     whose OS/phone asks for less motion (accessibility) — no manual switch needed ── */
  const mqReduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  function applyMotion() {
    docEl.dataset.motion = mqReduce.matches ? 'reduced' : 'full';
  }
  try { mqReduce.addEventListener('change', applyMotion); } catch {}
  applyMotion();

  /* ── language: فارسی / English ── */
  const langBtn = $('#lang-btn');
  function applyLanguage() {
    setLangDir();
    langBtn.querySelector('[data-ic]').textContent = LANG === 'fa' ? 'EN' : 'فا';
    langBtn.setAttribute('aria-label', tr('langAria'));
    langBtn.title = tr('langAria');
    applyI18n(document);
    render();     // library rows use TYPES/SOURCES, which read the current language
  }
  langBtn.addEventListener('click', () => {
    LANG = LANG === 'fa' ? 'en' : 'fa';
    write('gramafon:lang', LANG);
    pulse(langBtn, 'turn');
    if (document.startViewTransition && !isReduced() && docEl.dataset.perf !== 'low') document.startViewTransition(applyLanguage);
    else applyLanguage();
  });
  applyLanguage();

  /* ── install as an app (PWA) ── */
  const installBtn = $('#install-btn'), iosTip = $('#ios-tip');
  const TIP_KEY = 'gramafon:iosTipDismissed';
  let deferredInstall = null;

  function refreshInstallUi() {
    const blocked = docEl.dataset.mode === 'tg' || isStandalone();
    installBtn.hidden = blocked || !deferredInstall;
    iosTip.hidden = blocked || !IS_IOS || read(TIP_KEY, false) === true;
  }
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; refreshInstallUi(); });
  window.addEventListener('appinstalled', () => { deferredInstall = null; refreshInstallUi(); });
  installBtn.addEventListener('click', async () => {
    if (!deferredInstall) return;
    try { deferredInstall.prompt(); await deferredInstall.userChoice; } catch {}
    deferredInstall = null;
    refreshInstallUi();
  });
  $('#tip-close').addEventListener('click', () => { write(TIP_KEY, true); refreshInstallUi(); });
  try {
    window.matchMedia('(display-mode: standalone)').addEventListener('change', () => {
      if (docEl.dataset.mode !== 'tg') docEl.dataset.mode = isStandalone() ? 'standalone' : 'browser';
      refreshInstallUi();
    });
  } catch {}
  refreshInstallUi();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && docEl.dataset.mode !== 'tg') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }

  /* ── start ── */
  render();
  const shared = new URLSearchParams(location.search).get('l');
  const sharedParsed = shared ? parseLink(shared) : null;
  if (sharedParsed && !sharedParsed.error && sharedParsed.type !== 'link') {
    try { history.replaceState(null, '', location.pathname + location.hash); } catch {}
    addAndPlay(sharedParsed);
  } else {
    const last = library.find((i) => i.key === currentKey);
    if (last) play(last);
  }
})();

</script>
</body>
</html>
